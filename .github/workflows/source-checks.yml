name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source and pinned method
        run: python3 tools/verify_repo.py
      - name: Test runner failure detection
        run: |
          python3 -m unittest discover -s tests -p test_headless_runner.py
          python3 -m unittest discover -s tests -p test_windows_package.py
          python3 -m unittest discover -s tests -p test_toolchain.py
          python3 tools/toolchain.py --audit
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download and verify pinned engine
        run: python3 tools/toolchain.py --install linux
      - name: Import and run isolated core fixtures
        run: python3 tools/run_headless.py --godot .tools/pinned/linux/Godot_v4.7.2-stable_linux.x86_64
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headless-diagnostics
          path: build/ci/
          if-no-files-found: warn
          retention-days: 7
  source-import:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
          - runner: macos-14
            platform: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify pinned engine and clean source import
        run: python3 tools/toolchain.py --install ${{ matrix.platform }} --audit --import-check
      - name: Retain import diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: import-${{ matrix.platform }}
          path: build/toolchain/
          if-no-files-found: warn
          retention-days: 7
