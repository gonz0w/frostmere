name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source and pinned method
        run: python3 tools/verify_repo.py
      - name: Test runner failure detection
        run: |
          python3 -m unittest discover -s tests -p test_headless_runner.py
          python3 -m unittest discover -s tests -p test_windows_package.py
          python3 -m unittest discover -s tests -p test_portable_package.py
          python3 -m unittest discover -s tests -p test_toolchain.py
          python3 -m unittest discover -s tests -p test_launch.py
          python3 tools/toolchain.py --audit
  headless:
    defaults:
      run:
        working-directory: Frostmere QA 雪
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: Frostmere QA 雪
      - name: Download and verify pinned engine
        run: python3 tools/toolchain.py --install linux
      - name: Verify templates and build Linux package
        run: |
          python3 tools/toolchain.py --download-templates
          python3 tools/package_game.py --target linux --templates .tools/downloads/godot-4.7.2-templates.tpz
      - name: Import and run isolated core fixtures
        run: python3 tools/play.py --verify
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headless-diagnostics
          path: |
            Frostmere QA 雪/build/ci/
            Frostmere QA 雪/build/packages/**/*.log
          if-no-files-found: warn
          retention-days: 7
  source-import:
    defaults:
      run:
        working-directory: Frostmere QA 雪
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
          - runner: macos-15
            platform: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: Frostmere QA 雪
      - name: Verify pinned engine and clean source import
        run: python3 tools/toolchain.py --install ${{ matrix.platform }} --audit
      - name: Download verified export templates
        run: python3 tools/toolchain.py --download-templates
      - name: Build and inspect native-host package
        run: python3 tools/package_game.py --target ${{ matrix.platform }} --templates .tools/downloads/godot-4.7.2-templates.tpz
      - name: Test launcher errors
        run: python3 -m unittest discover -s tests -p test_launch.py
      - name: Run isolated source smoke
        run: python3 tools/play.py --smoke
      - name: Retain import diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: import-${{ matrix.platform }}
          path: |
            Frostmere QA 雪/build/ci/
            Frostmere QA 雪/build/packages/**/*.log
          if-no-files-found: warn
          retention-days: 7
  import-diagnostics:
    if: github.head_ref == 'codex/import-crash-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download verified engine
        run: python3 tools/toolchain.py --install linux
      - name: Install diagnostic debugger
        run: sudo apt-get update && sudo apt-get install -y gdb
      - name: Bounded debugger reproduction
        run: python3 tools/diagnose_import.py --godot .tools/pinned/linux/Godot_v4.7.2-stable_linux.x86_64
      - name: Retain debugger evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: import-debugger
          path: |
            build/import-diagnostics/*.log
            build/import-diagnostics/results.json
          retention-days: 7
